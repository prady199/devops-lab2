apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthapp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: healthapp}
  template:
    metadata:
      labels: {app: healthapp}
    spec:
      containers:
        - name: app
          image: docker.io/your-user/healthapp:0.0.0
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_VERSION, value: "__VERSION__"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: healthapp
spec:
  type: NodePort
  selector: {app: healthapp}
  ports: [{port: 80, targetPort: 5000, nodePort: 30080}]
