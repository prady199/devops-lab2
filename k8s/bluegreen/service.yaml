apiVersion: v1
kind: Service
metadata: {name: webapp-live}
spec:
  type: NodePort
  selector: {app: webapp, track: green}
  ports: [{port: 80, targetPort: 5000, nodePort: 30090}]
---
apiVersion: v1
kind: Service
metadata: {name: webapp-preview}
spec:
  type: NodePort
  selector: {app: webapp, track: blue}
  ports: [{port: 80, targetPort: 5000, nodePort: 30091}]
