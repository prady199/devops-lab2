apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthapp
  namespace: healthcare
spec:
  replicas: 2
  selector:
    matchLabels: {app: healthapp}
  template:
    metadata:
      labels: {app: healthapp}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: docker.io/your-user/healthapp:0.0.0
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_VERSION, value: "__VERSION__"}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: {name: app-secrets, key: api-token}
            - name: LOGIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: app-secrets, key: login-password}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: {name: app-secrets, key: secret-key}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: healthapp
  namespace: healthcare
spec:
  type: NodePort
  selector: {app: healthapp}
  ports: [{port: 80, targetPort: 5000, nodePort: 30100}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lockdown
  namespace: healthcare
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{protocol: TCP, port: 5000}]
